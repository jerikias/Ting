<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--card:#fff;--mu:#6b6a64;--ac:#b3261e;--ok:#1b7f3b;--no:#b3261e;--bd:#ddd8cc}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eeece6;--card:#222220;--mu:#9a988f;--ac:#ff7a6b;--ok:#52c27a;--no:#ff7a6b;--bd:#3a3935}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0}h1 b{color:var(--ac)}h2{margin:0 0 8px;font-size:20px}h3{margin:14px 0 6px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
nav{display:flex;gap:6px}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,.chip{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
button.on,.chip.on,nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.go{width:100%;margin-top:14px;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;font-size:17px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;min-height:52px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.big{flex:1;font-size:18px;font-weight:700}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-bottom:8px}
.hint{color:var(--mu);font-size:14px;margin:4px 0 10px}
.zh{font-size:28px;margin:10px 0 2px;line-height:1.3}.py{color:var(--ac);font-size:16px}.en{margin:4px 0 10px}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
textarea{min-height:150px}
.list{max-height:340px;overflow:auto;border:1px solid var(--bd);border-radius:10px}
.it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.it div{flex:1;min-width:0}.it small{color:var(--mu);display:block}
.it button{min-height:36px;padding:2px 10px}

#toast.s{opacity:1}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.stat div{border:1px solid var(--bd);border-radius:10px;padding:8px}.stat b{font-size:22px;display:block}
</style></head><body>

<nav><button data-a="tab" data-v="practice" id="t-practice">Practice</button><button data-a="tab" data-v="lib" id="t-lib">Sentences</button><button data-a="tab" data-v="stats" id="t-stats">Progress</button><button data-a="tab" data-v="set" id="t-set">⚙</button></nav></header>
<main id="app"></main><div id="toast"></div>
<script>
"use strict";
/* ---------- built-in sentences: zh|pinyin|english, '#' lines = situation ---------- */
const BASE_TXT=`#Business
这是我的电话号码。|Zhè shì wǒ de diànhuà hàomǎ.|This is my phone number.
多少钱？|Duōshao qián?|How much does it cost?
价格可以谈吗？|Jiàgé kěyǐ tán ma?|Can the price be negotiated?
我需要跟经理谈。|Wǒ xūyào gēn jīnglǐ tán.|I need to speak with the manager.
我们什么时候开会？|Wǒmen shénme shíhou kāihuì?|When are we having the meeting?
请把合同发给我。|Qǐng bǎ hétóng fā gěi wǒ.|Please send me the contract.
付款条件是什么？|Fùkuǎn tiáojiàn shì shénme?|What are the payment terms?
交货期是多久？|Jiāohuò qī shì duōjiǔ?|What is the delivery time?
发票已经开了。|Fāpiào yǐjīng kāi le.|The invoice has been issued.
这个价格含税吗？|Zhège jiàgé hán shuì ma?|Does this price include tax?
#Mining
矿井在哪里？|Kuàngjǐng zài nǎlǐ?|Where is the mine shaft?
矿石品位是多少？|Kuàngshí pǐnwèi shì duōshao?|What is the ore grade?
这里安全吗？|Zhèlǐ ānquán ma?|Is it safe here?
需要戴安全帽。|Xūyào dài ānquán mào.|You need to wear a safety helmet.
我们每天开采多少吨？|Wǒmen měi tiān kāicǎi duōshao dūn?|How many tons do we extract per day?
通风系统怎么样？|Tōngfēng xìtǒng zěnmeyàng?|How is the ventilation system?
#Construction
工地在哪里？|Gōngdì zài nǎlǐ?|Where is the construction site?
水泥够吗？|Shuǐní gòu ma?|Is there enough cement?
注意安全。|Zhùyì ānquán.|Pay attention to safety.
这个工程什么时候完工？|Zhège gōngchéng shénme shíhou wángōng?|When will this project be completed?
我们需要加班。|Wǒmen xūyào jiābān.|We need to work overtime.
#Logistics
货物什么时候到？|Huòwù shénme shíhou dào?|When will the goods arrive?
货物有损坏。|Huòwù yǒu sǔnhuài.|The goods are damaged.
运费是多少？|Yùnfèi shì duōshao?|What is the shipping cost?
需要清关。|Xūyào qīngguān.|Customs clearance is needed.
请盘点库存。|Qǐng pándiǎn kùcún.|Please take inventory.
#Factory
机器坏了。|Jīqì huài le.|The machine is broken.
有质量问题。|Yǒu zhìliàng wèntí.|There is a quality problem.
请叫技术员来。|Qǐng jiào jìshùyuán lái.|Please call the technician.
#Reception
请问您有预约吗？|Qǐngwèn nín yǒu yùyuē ma?|Do you have an appointment?
我帮您转接。|Wǒ bāng nín zhuǎnjiē.|I'll transfer you.
对不起，让您久等了。|Duìbuqǐ, ràng nín jiǔděng le.|Sorry to keep you waiting.
#Safety
小心！|Xiǎoxīn!|Be careful!
叫救护车！|Jiào jiùhùchē!|Call an ambulance!
发生事故了。|Fāshēng shìgù le.|There has been an accident.
#Negotiation & Money
我同意。|Wǒ tóngyì.|I agree.
这是我们的底线。|Zhè shì wǒmen de dǐxiàn.|This is our bottom line.
成交！|Chéngjiāo!|Deal!
可以分期付款吗？|Kěyǐ fēnqī fùkuǎn ma?|Can we pay in installments?
需要预付款。|Xūyào yùfùkuǎn.|A deposit is required.
太贵了。|Tài guì le.|Too expensive.
现金还是转账？|Xiànjīn háishì zhuǎnzhàng?|Cash or bank transfer?
我们需要进口许可证。|Wǒmen xūyào jìnkǒu xǔkě zhèng.|We need an import license.
信用证可以吗？|Xìnyòngzhèng kěyǐ ma?|Is a letter of credit okay?
#Everyday
下午三点见。|Xiàwǔ sān diǎn jiàn.|See you at 3 PM.
我需要推迟一下。|Wǒ xūyào tuīchí yíxià.|I need to postpone.
怎么走？|Zěnme zǒu?|How do I get there?
左转还是右转？|Zuǒ zhuǎn háishì yòu zhuǎn?|Turn left or right?
好久不见。|Hǎojiǔ bú jiàn.|Long time no see.
加油！|Jiāyóu!|Come on! / You can do it!
别放弃。|Bié fàngqì.|Don't give up.
#Restaurant & Shopping
我不能吃太辣的菜，有什么推荐吗？|Wǒ bù néng chī tài là de cài, yǒu shénme tuījiàn ma?|I can't eat very spicy food. Do you have any recommendations?
请结账，可以用手机支付吗？|Qǐng jiézhàng, kěyǐ yòng shǒujī zhīfù ma?|The bill, please. Can I pay by mobile phone?
如果你买两件，我给你打八折。|Rúguǒ nǐ mǎi liǎng jiàn, wǒ gěi nǐ dǎ bā zhé.|If you buy two pieces, I'll give you 20% off.
#Directions & Travel
请问，去火车站怎么走？|Qǐngwèn, qù huǒchēzhàn zěnme zǒu?|Excuse me, how do I get to the train station?
一直往前走，到第二个路口向左拐。|Yìzhí wǎng qián zǒu, dào dì-èr gè lùkǒu xiàng zuǒ guǎi.|Go straight ahead, and turn left at the second intersection.
登机口在二十三号，七点半开始登机。|Dēngjīkǒu zài èrshísān hào, qī diǎn bàn kāishǐ dēngjī.|The boarding gate is number 23, and boarding starts at 7:30.
#Family, Weather & Health
我家有五口人：爸爸、妈妈、哥哥、妹妹和我。|Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, gēge, mèimei hé wǒ.|There are five people in my family: Dad, Mum, my older brother, my younger sister and me.
听说明天会下大雨，出门别忘了带伞。|Tīngshuō míngtiān huì xià dàyǔ, chūmén bié wàng le dài sǎn.|I heard it will rain heavily tomorrow, so don't forget to take an umbrella when you go out.
医生，我从昨天开始头疼，还有点发烧。|Yīshēng, wǒ cóng zuótiān kāishǐ tóuténg, hái yǒudiǎn fāshāo.|Doctor, I've had a headache since yesterday, and I have a slight fever too.
#Trading & Creative
不要把所有的资金放在同一笔交易里。|Búyào bǎ suǒyǒu de zījīn fàng zài tóng yì bǐ jiāoyì lǐ.|Don't put all your funds into the same trade.
市场有涨有跌，保持冷静比追逐利润更重要。|Shìchǎng yǒu zhǎng yǒu diē, bǎochí lěngjìng bǐ zhuīzhú lìrùn gèng zhòngyào.|Markets go up and down; staying calm matters more than chasing profit.
我的诗歌讲述爱情、家庭和信仰的故事。|Wǒ de shīgē jiǎngshù àiqíng, jiātíng hé xìnyǎng de gùshi.|My poems tell stories of love, family and faith.
下周二下午三点您方便吗？|Xià zhōu'èr xiàwǔ sān diǎn nín fāngbiàn ma?|Is next Tuesday at 3 p.m. convenient for you?
我会把会议通知发到您的邮箱。|Wǒ huì bǎ huìyì tōngzhī fā dào nín de yóuxiāng.|I'll send the meeting notice to your email.`;

/* ---------- helpers & state ---------- */
const $=s=>document.querySelector(s),LS="tingV2";
const CJK=/[\u3400-\u9fff]/,TONE=/[āáǎàēéěèīíǐìōóǒòūúǔùǖǚǜ]/i;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),today=()=>fmt(new Date());
const DEF=()=>({custom:[],stats:{},marks:{},gloss:{},sess:null,day:{d:"",n:0},streak:{last:"",n:0},cfg:{lv:[1,2,3],cats:null,mode:"stage",kind:"mc",slow0:false,hint:true,rate:.85,ramp:true,goal:20,rot:false,vf:"",vm:""}});
let S=(()=>{const d=DEF();try{const x=JSON.parse(localStorage.getItem(LS)||localStorage.getItem("tingV1"));if(x){Object.assign(d,x);d.cfg=Object.assign(DEF().cfg,x.cfg||{})}}catch(e){}return d})();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function toast(m){const t=$("#toast");t.textContent=m;t.className="s";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",2400)}
const autoLv=zh=>{const n=zh.replace(/[^\u3400-\u9fff]/g,"").length;return n<=6?1:n<=12?2:3};
let BASE=[],ALL=[];
BASE_TXT.split("\n").reduce((c,l)=>{if(l[0]==="#")return l.slice(1);const p=l.split("|");BASE.push({zh:p[0],py:p[1],en:p[2],cat:c});return c},"");
function rebuild(){ALL=BASE.concat(S.custom).map(x=>Object.assign({},x,{lv:x.lv||autoLv(x.zh)}))}
rebuild();
const IV=[1,3,7,14,30];
const isDue=x=>{const s=S.stats[x.zh];return !!s&&(s.due?s.due<=Date.now():(s.w>0&&(s.st||0)<2))};
const TP={ma:["mā","má","mǎ","mà"],ba:["bā","bá","bǎ","bà"],shi:["shī","shí","shǐ","shì"],yi:["yī","yí","yǐ","yì"],tong:["tōng","tóng","tǒng","tòng"],xie:["xiē","xié","xiě","xiè"]};
const TC={ma:"妈麻马骂",ba:"八拔把爸",shi:"诗时史是",yi:"衣姨椅意",tong:"通同捅痛",xie:"些鞋写谢"};

/* ---------- speech ---------- */
let voices=[];const hasTTS="speechSynthesis" in window;
function loadV(){voices=speechSynthesis.getVoices().filter(v=>/^zh|cmn/i.test(v.lang)||/chinese|mandarin|中文|普通话/i.test(v.name));if(view==="set")render()}
if(hasTTS){speechSynthesis.onvoiceschanged=loadV;setTimeout(loadV,0)}
const MALE=/kangkang|yunxi|yunyang|yunjian|male|danny|zhiwei|liang|binbin|yunze|li-mu/i;
function pick(g){if(S.cfg.rot&&voices.length)return voices[Math.random()*voices.length|0];
 const id=g==="m"?S.cfg.vm:S.cfg.vf,v=id&&voices.find(v=>v.voiceURI===id);if(v)return v;
 const m=voices.filter(v=>MALE.test(v.name)&&!/female/i.test(v.name)),f=voices.filter(v=>!m.includes(v));
 return(g==="m"?m:f)[0]||voices[0]||null}
function say(t,o){o=o||{};if(!hasTTS){toast("No speech engine in this browser");return}
 speechSynthesis.cancel();
 setTimeout(()=>{const u=new SpeechSynthesisUtterance(t),g=o.g||"f",v=pick(g),ex=S.cfg.rot||(g==="m"?S.cfg.vm:S.cfg.vf);
  u.lang="zh-CN";if(v){u.voice=v;u.lang=v.lang}
  const isM=v&&MALE.test(v.name)&&!/female/i.test(v.name);u.pitch=(ex||isM)?1:(g==="m"?.7:1.05);
  u.rate=o.rate||S.cfg.rate;const n=$("#vn");if(n)n.textContent=v?v.name+" ("+v.lang+")":"default voice";speechSynthesis.speak(u)},60)}

/* ---------- similarity for smarter wrong answers ---------- */
const syl=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().split(/[^a-z]+/).filter(Boolean);
const nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/v/g,"u").replace(/[^a-z]/g,"");
const nzh=s=>s.replace(/[^\u3400-\u9fff]/g,"");
const jac=(a,b)=>{let i=0;a.forEach(k=>b.has(k)&&i++);return i/((a.size+b.size-i)||1)};
const CS=x=>x._c||(x._c=new Set(nzh(x.zh))),SS=x=>x._s||(x._s=new Set(syl(x.py)));
const sim=(x,y)=>jac(CS(x),CS(y))*2+jac(SS(x),SS(y))+(y.cat===x.cat?.3:0)-Math.abs(x.zh.length-y.zh.length)/40;
function options(x){const c=ALL.filter(y=>y.zh!==x.zh&&y.en!==x.en).map(y=>({y,s:sim(x,y)})).sort((a,b)=>b.s-a.s).slice(0,6);
 const o=[{en:x.en,ok:true}],seen=new Set([x.en]);
 for(const k of shuf(c)){if(o.length>=3)break;if(!seen.has(k.y.en)){seen.add(k.y.en);o.push({en:k.y.en,ok:false})}}
 return shuf(o)}
function words(z){try{if(Intl.Segmenter)return[...new Intl.Segmenter("zh",{granularity:"word"}).segment(z)].filter(s=>s.isWordLike).map(s=>s.segment)}catch(e){}return z.match(/[\u3400-\u9fff]/g)||[]}
const dictOk=(i,x)=>{i=i.trim();return !!i&&(CJK.test(i)?nzh(i)===nzh(x.zh):nz(i)===nz(x.py))};

/* ---------- progress: SRS, daily goal, streak ---------- */
function rec(x,ok){const s=S.stats[x.zh]||(S.stats[x.zh]={a:0,c:0,w:0,st:0,bx:0,due:0});s.a++;
 if(ok){s.c++;s.st=(s.st||0)+1;s.bx=s.a===1?2:Math.min((s.bx||0)+1,5)}else{s.w++;s.st=0;s.bx=0}
 s.due=Date.now()+(s.bx?IV[s.bx-1]:1)*864e5;s.t=Date.now()}
function tick(){const t=today();if(S.day.d!==t)S.day={d:t,n:0};S.day.n++;
 if(S.day.n>=S.cfg.goal&&S.streak.last!==t){S.streak.n=S.streak.last===fmt(new Date(Date.now()-864e5))?S.streak.n+1:1;S.streak.last=t;toast("Daily goal reached! 🔥 "+S.streak.n+"-day streak")}}

/* ---------- quiz engine (session survives refresh) ---------- */
let view="practice",Q=null,PREV=null;
function pool(){const c=S.cfg;
 if(c.mode==="due")return ALL.filter(isDue);
 if(c.mode==="hard")return ALL.filter(x=>{const s=S.stats[x.zh];return s&&s.w>0&&(s.st||0)<2});
 if(c.mode==="marks")return ALL.filter(x=>S.marks[x.zh]);
 return ALL.filter(x=>c.lv.includes(x.lv)&&(!c.cats||c.cats.includes(x.cat)))}
function toneItems(){const k=Object.keys(TP),o=[];for(let i=0;i<20;i++){const b=k[Math.random()*k.length|0],t=Math.random()*4|0;o.push({tone:1,zh:TC[b][t],py:TP[b][t],base:b,t,en:"",cat:"Tone drill",lv:1})}return o}
function startQ(list,kind){Q={kind,queue:list,right:0,n:0,g:Math.random()<.5?"f":"m",cur:null,ans:null,missed:[],rq:new Set(),played:0};nextQ()}
function sessSave(){if(!Q||Q.kind==="tone"||(!Q.cur&&!Q.queue.length))S.sess=null;
 else S.sess={k:Q.kind,q:Q.queue.map(x=>x.zh),cur:Q.cur&&Q.ans==null?Q.cur.zh:null,right:Q.right,n:Q.n,m:Q.missed.map(x=>x.zh),rq:[...Q.rq],g:Q.g};save()}
function nextQ(np){if(!Q.queue.length){Q.cur=null;S.sess=null;save();return render()}
 Q.cur=Q.queue.shift();Q.ans=null;Q.ok=null;Q.played=0;Q.g=Q.g==="f"?"m":"f";
 Q.opts=Q.cur.tone?TP[Q.cur.base].map((p,i)=>({en:p,ok:i===Q.cur.t})):Q.kind==="dict"?null:options(Q.cur);
 sessSave();render();if(!np)setTimeout(()=>doPlay(S.cfg.slow0),250)}
function rateFor(x){if(x.tone)return .7;if(Q.kind==="chal")return 1.2;
 return S.cfg.ramp?[.6,.75,.9,1][Math.min((S.stats[x.zh]||{}).st||0,3)]:S.cfg.rate}
function doPlay(slow){const x=Q&&Q.cur;if(!x)return;
 if(Q.kind==="chal"&&Q.ans==null&&Q.played>=1)return toast("Challenge mode: one play only");
 Q.played++;say(x.zh,{g:Q.g,rate:slow?.5:rateFor(x)})}
function finish(ok){const x=Q.cur;Q.ok=ok;Q.n++;if(!x.tone)rec(x,ok);tick();
 if(ok)Q.right++;else if(!x.tone){Q.missed.push(x);if(!Q.rq.has(x.zh)){Q.rq.add(x.zh);Q.queue.splice(Math.min(Q.queue.length,3+(Math.random()*4|0)),0,x)}}
 sessSave();render()}
function addC(x){if(x&&x.zh&&x.en&&!ALL.some(y=>y.zh===x.zh)&&!S.custom.some(y=>y.zh===x.zh)){S.custom.push({zh:x.zh,py:x.py||"",en:x.en,cat:x.cat||"Imported",lv:x.lv});ALL.push(Object.assign({},x,{lv:x.lv||autoLv(x.zh)}))}}

/* ---------- actions ---------- */
const ACT={
 tab(v){view=v;render()},
 mode(v){S.cfg.mode=v;save();render()},
 kind(v){S.cfg.kind=v;save();render()},
 lv(v){v=+v;const a=S.cfg.lv,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);if(!a.length)a.push(v);save();render()},
 cat(v){const all=[...new Set(ALL.map(x=>x.cat))];let c=(S.cfg.cats||all).slice(),i=c.indexOf(v);i<0?c.push(v):c.splice(i,1);S.cfg.cats=(!c.length||c.length===all.length)?null:c;save();render()},
 tog(v){S.cfg[v]=!S.cfg[v];save();render()},
 start(){const c=S.cfg;if(c.kind==="tone")return startQ(toneItems(),"tone");
  const p=pool();if(!p.length)return toast("Nothing to practise with these filters yet");
  let q;if(c.mode==="stage"||c.mode==="random"){
   if(c.mode==="stage")q=[...shuf(p.filter(isDue)),...shuf(p.filter(x=>!S.stats[x.zh])).sort((a,b)=>a.lv-b.lv),...shuf(p.filter(x=>S.stats[x.zh]&&!isDue(x)))];
   else q=shuf(p);q=q.slice(0,40)}else q=shuf(p);
  startQ(q,c.kind)},
 play(){doPlay(false)},slow(){doPlay(true)},
 opt(v){if(!Q||!Q.cur||Q.ans!=null||!Q.opts||!Q.opts[+v])return;Q.ans=+v;finish(Q.opts[+v].ok)},
 check(){const d=$("#dt");if(!Q||!Q.cur||Q.ans!=null||!d)return;const v=d.value.trim();if(!v)return toast("Type what you heard first");Q.ans=v;finish(dictOk(v,Q.cur))},
 next(){nextQ()},
 mark(v){const z=v||(Q&&Q.cur&&Q.cur.zh);if(!z)return;S.marks[z]?delete S.marks[z]:S.marks[z]=1;save();render()},
 say(v){const x=ALL.find(y=>y.zh===v);if(x)say(x.zh,{g:Math.random()<.5?"f":"m"})},
 word(v){say(v,{rate:.7,g:Q?Q.g:"f"});const b=$("#wb");if(!b)return;const g=S.gloss[v];
  b.innerHTML=`<b>${esc(v)}</b> — ${g?esc(g):"<i>no meaning saved yet</i>"} · <a href="https://www.mdbg.net/chinese/dictionary?wdqb=${encodeURIComponent(v)}" target=_blank rel=noopener>look up online</a> <button data-a=gl data-v="${esc(v)}">✎ Save meaning</button>`},
 gl(v){const m=prompt("Meaning of "+v+":",S.gloss[v]||"");if(m!=null){m.trim()?S.gloss[v]=m.trim():delete S.gloss[v];save();ACT.word(v)}},
 test(v){say("你好，欢迎学习中文。我们开始吧。",{g:v,rate:.85})},
 end(){Q=null;S.sess=null;save();render()},
 retry(){const m=[...new Map(Q.missed.map(x=>[x.zh,x])).values()];startQ(shuf(m),Q.kind)},
 parse(){const t=$("#imp").value.trim();if(!t)return toast("Paste some sentences first");
  if(t[0]==="{"){try{const j=JSON.parse(t);(j.custom||[]).forEach(addC);Object.assign(S.marks,j.marks||{});Object.assign(S.gloss,j.gloss||{});
    for(const k in(j.stats||{})){const a=j.stats[k],b=S.stats[k];if(!b||a.a>b.a)S.stats[k]=a}
    save();rebuild();toast("Backup restored");return render()}catch(e){return toast("That backup could not be read")}}
  const items=parse(t,$("#icat").value.trim()||"Imported"),have=new Set(ALL.map(x=>x.zh));
  PREV=items.filter(x=>!have.has(x.zh));PREV.dup=items.length-PREV.length;render();
  if(!PREV.length)toast("No new sentences found")},

  a.href=URL.createObjectURL(b);a.download="ting-backup.json";document.body.appendChild(a);a.click();a.remove()},
 reset(){if(confirm("Erase all scores, streak and bookmarks? Your added sentences stay.")){S.stats={};S.marks={};S.streak={last:"",n:0};S.day={d:"",n:0};S.sess=null;Q=null;save();render()}}
};
/* ---------- parser: accepts "zh | pinyin | english" lines OR the PDF layout (zh / pinyin / english lines) ---------- */
function parse(txt,cat){
 const out=[];let c=cat,cur=null;
 const fin=()=>{if(!cur)return;let el=cur.el;
  while(el.length>1&&!/[.?!)…。！？]$/.test(el[el.length-1])&&el[el.length-1].split(/\s+/).length<=6){c=el.pop().replace(/^\d+\.\s*/,"")}
  const en=el.join(" ").split(/Key pattern/)[0].trim();
  if(cur.zh&&en&&cur.zh.length<=90)out.push({zh:cur.zh.trim(),py:cur.py.trim(),en,cat:cur.cat});cur=null};
 let L=[];
 for(let l of txt.replace(/\r/g,"").split("\n")){l=l.trim().replace(/^\d+\.\s*/,"");if(!l)continue;
  if(l.includes("|")&&CJK.test(l)){L.push({pipe:l});continue}
  const m=l.search(CJK);
  if(m>0){const pre=l.slice(0,m).trim();if(/[A-Za-z.?!)'"…]$/.test(pre)){L.push(pre);l=l.slice(m)}}
  const mm=l.match(/^([^A-Za-z\u00C0-\u024F]+)([A-Za-z\u00C0-\u024F].*)$/);
  if(mm&&CJK.test(mm[1])&&TONE.test(mm[2])){L.push(mm[1].trim());L.push(mm[2].trim())}else L.push(l)}
 for(const l of L){
  if(l.pipe){fin();const p=l.pipe.split("|").map(s=>s.trim());
   if(p.length>=3)out.push({zh:p[0],py:p[1],en:p[2],cat:p[3]||c});else if(p.length===2)out.push({zh:p[0],py:"",en:p[1],cat:c});continue}
  if(CJK.test(l)){if(cur&&cur.st==="zh")cur.zh+=l;else{fin();cur={zh:l,py:"",el:[],st:"zh",cat:c}}continue}
  if(!cur){if(!TONE.test(l)&&l.split(/\s+/).length<=6)c=l;continue}
  if(TONE.test(l)&&cur.st!=="en"){cur.py+=(cur.py?" ":"")+l;cur.st="py";continue}
  cur.st="en";cur.el.push(l)}
 fin();return out}

function lib(){const n=S.custom.length;
 $("#app").innerHTML=`<div class=card><h2>Add sentences</h2>
 <p class=hint>Paste lines like <b>你好。| Nǐ hǎo. | Hello.</b> — or paste text straight from your PDF (Chinese line, pinyin line, English line, repeating). Headings in the PDF become situations automatically.</p>
 <textarea id=imp placeholder="Paste here…"></textarea>
 <h3>Situation name (used when none is found)</h3><input type=text id=icat value="Imported">
 <div class=row style="margin-top:10px"><button class=big data-a=parse>Preview</button></div></div>
 ${PREV?`<div class=card><h2>Found ${PREV.length} new sentence${PREV.length==1?"":"s"}${PREV.dup?` (${PREV.dup} already in the app)`:""}</h2>
 <div class=list>${PREV.slice(0,200).map(x=>`<div class=it><div>${esc(x.zh)}<small>${esc(x.py)} — ${esc(x.en)} · ${esc(x.cat)}</small></div></div>`).join("")}</div>
 <h3>Level</h3><select id=ilv><option value=0>Auto-grade by length</option><option value=1>1 · Easy</option><option value=2>2 · Medium</option><option value=3>3 · Hard</option></select>
 <div class=row style="margin-top:10px"><button class=big data-a=confirm ${PREV.length?"":"disabled"}>Add them</button><button data-a=cancel>Cancel</button></div></div>`:""}
 <div class=card><h2>All sentences (${ALL.length})</h2><input type=text id=q placeholder="Search Chinese, pinyin or English"><div class=list id=lst style="margin-top:8px"></div>
 <div class=row style="margin-top:10px"><button data-a=export>Back up (download)</button></div>
 <p class=hint>${n} added by you. To restore a backup, paste its contents into the box above and press Preview.</p></div>`;list()}
function list(){const q=($("#q")||{value:""}).value.toLowerCase(),el=$("#lst");if(!el)return;
 const r=ALL.filter(x=>!q||(x.zh+x.py+x.en+x.cat).toLowerCase().includes(q)).slice(0,80);
 el.innerHTML=r.map(x=>`<div class=it><button data-a=say data-v="${esc(x.zh)}">🔊</button><div>${esc(x.zh)}<small>${esc(x.py)}<br>${esc(x.en)} · ${esc(x.cat)} · L${x.lv}</small></div><button data-a=mark data-v="${esc(x.zh)}">${S.marks[x.zh]?"★":"☆"}</button>${S.custom.some(y=>y.zh===x.zh)?`<button data-a=del data-v="${esc(x.zh)}">✕</button>`:""}</div>`).join("")||"<div class=it>No matches</div>"}
/* ---------- views ---------- */
function render(){["practice","lib","stats","set"].forEach(v=>{const e=$("#t-"+v);if(e)e.className=v===view?"on":""});
 if(view==="practice")return Q?(Q.cur?quiz():result()):home();
 ({lib,stats,set:setv})[view]()}
function home(){const c=S.cfg,cats=[...new Set(ALL.map(x=>x.cat))],sel=c.cats||cats,tone=c.kind==="tone",adv=!tone&&(c.mode==="stage"||c.mode==="random"),t=today();
 const dn=S.day.d===t?S.day.n:0,due=ALL.filter(isDue).length,fresh=ALL.filter(x=>!S.stats[x.zh]).length;
 const sk=(S.streak.last===t||S.streak.last===fmt(new Date(Date.now()-864e5)))?S.streak.n:0;
 const hints={hard:"Sentences you got wrong and haven't yet got right twice in a row.",marks:"Sentences you starred with ☆.",due:"Sentences scheduled for review now. Wrong ones return the next day, then after 3, 7, 14 and 30 days."};
 const n=tone?20:(adv?Math.min(pool().length,40):pool().length);
 $("#app").innerHTML=`${hasTTS?"":`<div class=warn>This browser has no speech engine. Try Chrome, Edge or Safari.</div>`}
 <div class=card><div class=top><span>🔥 ${sk}-day streak</span><span>Today ${dn}/${c.goal}</span></div><div class=bar><i style="width:${Math.min(100,dn/c.goal*100)}%"></i></div>
 <p class=hint style="margin-bottom:0">${due} due for review · ${fresh} new sentences left</p></div>
 <div class=card><h2>How do you want to listen?</h2><div class=row>${[["mc","Multiple choice"],["dict","Dictation (type it)"],["chal","Challenge: fast, 1 play"],["tone","Tone drills"]].map(m=>`<button class="chip${c.kind===m[0]?" on":""}" data-a=kind data-v=${m[0]}>${m[1]}</button>`).join("")}</div>
 ${tone?`<p class=hint>Listen to a single syllable and pick its tone (1st – 4th).</p>`:`<h3>What to practise</h3><div class=row>${[["stage","Stages (continues forward)"],["random","Random mix"],["due","Due for review ("+due+")"],["hard","My hard ones"],["marks","Bookmarked"]].map(m=>`<button class="chip${c.mode===m[0]?" on":""}" data-a=mode data-v=${m[0]}>${m[1]}</button>`).join("")}</div>
 ${adv?`<h3>Levels</h3><div class=row>${[[1,"1 · Short & easy"],[2,"2 · Medium"],[3,"3 · Long"]].map(l=>`<button class="chip${c.lv.includes(l[0])?" on":""}" data-a=lv data-v=${l[0]}>${l[1]}</button>`).join("")}</div>
 <h3>Situations</h3><div class=row>${cats.map(k=>`<button class="chip${sel.includes(k)?" on":""}" data-a=cat data-v="${esc(k)}">${esc(k)}</button>`).join("")}</div>`:`<p class=hint>${hints[c.mode]}</p>`}`}
 <h3>Options</h3><div class=row>${[["hint","Situation hint"],["slow0","Start slow"],["ramp","Speed ramp"]].map(o=>`<button class="chip${c[o[0]]?" on":""}" data-a=tog data-v=${o[0]}>${o[1]}</button>`).join("")}</div>
 <p class=hint>Speed ramp: new sentences play slow and speed up as you get them right. Without it, this base speed is used:</p>
 <input type=range id=rate min=.5 max=1.1 step=.05 value=${c.rate} style="width:100%">
 <button class=go data-a=start>Start · ${n} ${tone?"drills":"sentences"}</button></div>
 <p class=hint>Your session is saved automatically — close or refresh and it carries on where you stopped. Keys: Space replays, 1–4 answer, Enter next.</p>`}
function reveal(x){const w=x.tone?"":words(x.zh).map(w=>`<button class=chip data-a=word data-v="${esc(w)}">${esc(w)}</button>`).join(" ");
 return `<div style="color:${Q.ok?"var(--ok)":"var(--no)"};font-weight:700;margin-top:10px">${Q.ok?"✔ Correct":"✘ Not quite"}</div><div class=zh>${esc(x.zh)}</div><div class=py>${esc(x.py)}</div><div class=en>${esc(x.en)}</div>
 ${w?`<h3>Tap a word</h3><div class=row>${w}</div><div id=wb class=hint></div>`:""}
 <div class=row style="margin-top:8px">${x.tone?"":`<button data-a=mark>${S.marks[x.zh]?"★ Bookmarked":"☆ Bookmark"}</button>`}<button data-a=play>🔊 Again</button><button class=big data-a=next style="background:var(--ac);color:#fff">Next →</button></div>`}
function quiz(){const x=Q.cur,a=Q.ans!=null,k=Q.kind,t=!!x.tone;
 const inp=k==="dict"?`<input type=text id=dt autocapitalize=off autocomplete=off autocorrect=off spellcheck=false placeholder="Type pinyin (tones optional) or characters" ${a?`disabled value="${esc(Q.ans)}"`:""}>${a?"":`<button class=go data-a=check>Check</button>`}`
  :Q.opts.map((o,i)=>`<button class="opt${a?(o.ok?" ok":i===Q.ans?" no":""):""}" data-a=opt data-v=${i}>${i+1}. ${esc(o.en)}</button>`).join("");
 $("#app").innerHTML=`<div class=card><div class=top><span>${Q.n} answered · ${Q.right} right · ${Q.queue.length+1} to go</span><span>${t?"Tone drill":"Level "+x.lv}</span></div>
 ${t?`<div class=hint>Which tone is it? Syllable: <b>${x.base}</b></div>`:S.cfg.hint?`<div class=hint>Situation: ${esc(x.cat)}</div>`:""}
 <div class=row><button class=big data-a=play>🔊 Play</button>${k==="chal"?"":`<button class=big data-a=slow>🐢 Slower</button>`}</div>
 <div class=hint>Voice: <span id=vn>–</span>${k==="chal"?" · fast, one play only":""}</div>
 ${inp}${a?reveal(x):""}
 <div class=row style="margin-top:10px"><button data-a=end>End session</button></div></div>`;
 const d=$("#dt");if(d&&!d.disabled)setTimeout(()=>d.focus(),60)}
function result(){const m=new Set(Q.missed.map(x=>x.zh)).size,pct=Q.n?Math.round(Q.right/Q.n*100):0;
 $("#app").innerHTML=`<div class=card><h2>Session complete</h2><p>${Q.right} of ${Q.n} answers right (${pct}%). Missed sentences will come back for review.</p>
 <div class=row>${m?`<button class=big data-a=retry>Retry missed (${m})</button>`:""}<button class=big data-a=end>Back</button></div></div>`}
function stats(){let A=0,C=0,att=0,mas=0,hard=0;const lv={1:[0,0],2:[0,0],3:[0,0]};
 ALL.forEach(x=>{const s=S.stats[x.zh];if(!s)return;att++;A+=s.a;C+=s.c;lv[x.lv][0]+=s.a;lv[x.lv][1]+=s.c;if((s.st||0)>=2)mas++;if(s.w>0&&(s.st||0)<2)hard++});
 const p=(a,b)=>a?Math.round(b/a*100)+"%":"–",t=today(),sk=(S.streak.last===t||S.streak.last===fmt(new Date(Date.now()-864e5)))?S.streak.n:0;
 $("#app").innerHTML=`<div class=card><h2>Your progress</h2><div class=stat>
 <div><b>🔥 ${sk}</b>day streak</div><div><b>${S.day.d===t?S.day.n:0}/${S.cfg.goal}</b>today</div><div><b>${att}/${ALL.length}</b>sentences tried</div><div><b>${p(A,C)}</b>accuracy</div><div><b>${mas}</b>mastered</div><div><b>${hard}</b>hard ones</div><div><b>${ALL.filter(isDue).length}</b>due now</div><div><b>${Object.keys(S.marks).length}</b>bookmarks</div></div>
 <h3>Accuracy by level</h3><div class=stat>${[1,2,3].map(i=>`<div><b>${p(lv[i][0],lv[i][1])}</b>Level ${i}</div>`).join("")}</div>
 <div class=row style="margin-top:14px"><button data-a=reset>Reset scores</button></div></div>`}
function setv(){const c=S.cfg,sel=cur=>`<option value="">Auto-pick</option>`+voices.map(v=>`<option value="${esc(v.voiceURI)}"${v.voiceURI===cur?" selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("");
 $("#app").innerHTML=`<div class=card><h2>Voices & accents</h2>${voices.length?"":`<div class=warn>No Chinese voices found. Install one in your device's speech settings (Android: Text-to-speech → install voice data; Windows: Settings → Speech → Add voices; iPhone: Accessibility → Spoken Content → Voices → Chinese), then reopen the app.</div>`}
 <h3>Female voice</h3><select id=vf>${sel(c.vf)}</select><button data-a=test data-v=f style="margin-top:6px">▶ Test</button>
 <h3>Male voice</h3><select id=vm>${sel(c.vm)}</select><button data-a=test data-v=m style="margin-top:6px">▶ Test</button>
 <p class=hint>${voices.length} Chinese voice${voices.length==1?"":"s"} found on this device. Mainland (zh-CN), Taiwan (zh-TW) and other accents show up here when installed. If a "male" voice sounds female, choose another above.</p>
 <div class=row><button class="chip${c.rot?" on":""}" data-a=tog data-v=rot>Rotate through ALL voices (accent variety)</button></div></div>
 <div class=card><h2>Daily goal</h2><input type=number id=goal min=1 max=500 value=${c.goal}><p class=hint>Sentences per day to keep your streak going.</p></div>
 <div class=card><h2>Your data</h2><p class=hint>Scores, streak, bookmarks and session are saved in this browser and survive refreshes. To move to another phone, use Back up on the Sentences tab.</p></div>`}

/* ---------- events & init ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t.dataset.v,t)});
document.addEventListener("input",e=>{if(e.target.id==="rate"){S.cfg.rate=+e.target.value;save()}if(e.target.id==="q")list()});
document.addEventListener("change",e=>{const i=e.target.id;if(i==="vf"||i==="vm"){S.cfg[i]=e.target.value;save()}if(i==="goal"){S.cfg.goal=Math.max(1,+e.target.value||20);save()}});
document.addEventListener("keydown",e=>{if(!Q||!Q.cur||view!=="practice")return;const t=e.target;
 if(t.id==="dt"){if(e.key==="Enter"){e.preventDefault();Q.ans==null?ACT.check():ACT.next()}return}
 if(/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;
 if(e.key===" "){e.preventDefault();ACT.play()}else if("1234".includes(e.key)&&e.key&&Q.kind!=="dict")ACT.opt(+e.key-1);else if(e.key==="Enter"&&Q.ans!=null)ACT.next()});
(function(){const s=S.sess;if(!s)return;const m=new Map(ALL.map(x=>[x.zh,x])),f=a=>(a||[]).map(z=>m.get(z)).filter(Boolean),q=f(s.q);
 if(s.cur&&m.get(s.cur))q.unshift(m.get(s.cur));if(!q.length){S.sess=null;return}
 Q={kind:s.k,queue:q,right:s.right||0,n:s.n||0,g:s.g||"f",cur:null,ans:null,missed:f(s.m),rq:new Set(s.rq||[]),played:0};nextQ(true)})();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
